# Builds the Windows installer and attaches it to a GitHub release whenever a version tag such as v2.2.0 is pushed.
# Installed copies update from the newest release, so the release needs latest.yml and the blockmap as well as the installer.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish the installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/NEXUS-Setup-*.exe dist/NEXUS-Setup-*.exe.blockmap dist/latest.yml --generate-notes
